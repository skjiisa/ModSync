name: Bug report
description: Something in ModSync does not work as expected
title: "[Bug]: "
labels: [bug]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the report. Please fill in as much as you can; the doctor
        output and (for Steam launch problems) the launch hook log are the two
        things that most often make a bug fixable.
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: dropdown
    id: machine
    attributes:
      label: Machine
      options:
        - Steam Deck (SteamOS)
        - Desktop / laptop Linux
        - Other (describe below)
    validations:
      required: true
  - type: input
    id: distro
    attributes:
      label: Distro and version
      description: e.g. SteamOS 3.7, Fedora 42, Arch, Ubuntu 24.04. On the Deck, mention Gaming Mode vs Desktop Mode.
      placeholder: SteamOS 3.7 (Desktop Mode)
    validations:
      required: true
  - type: dropdown
    id: install-method
    attributes:
      label: How is ModSync installed?
      options:
        - Flatpak (io.github.skjiisa.ModSync)
        - pip / uv
        - From source (git checkout)
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: ModSync version or commit
      placeholder: 0.1.0.dev0 / commit 12adbcc
  - type: dropdown
    id: steam-flavour
    attributes:
      label: Steam install
      options:
        - Native (distro package or SteamOS)
        - Flatpak (com.valvesoftware.Steam)
        - Not sure
  - type: textarea
    id: doctor
    attributes:
      label: Output of `modsync doctor`
      description: |
        Run `modsync doctor` (Flatpak: `flatpak run io.github.skjiisa.ModSync doctor`)
        and paste the full output. Remove anything you consider private.
      render: text
    validations:
      required: true
  - type: textarea
    id: launch-hook-log
    attributes:
      label: Launch hook log (if the bug involves launching from Steam)
      description: |
        If the problem happens when pressing Play in Steam or involves the launch
        hook, paste the contents of `~/.local/state/modsync/launch-hook.log`
        (`cat ~/.local/state/modsync/launch-hook.log`).
      render: text
  - type: textarea
    id: logs
    attributes:
      label: Other logs or screenshots
      description: Terminal output, tracebacks, screenshots.
