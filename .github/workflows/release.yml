# Builds the Flatpak bundle and the Python wheel/sdist, then publishes them
# as a GitHub release. There is no Flathub listing; the .flatpak attached
# here is the release channel (README "Install" section).
#
# - Push a tag `vX.Y.Z` or `vX.Y.Z-rc1` to build and publish. Tags with a
#   pre-release suffix (`-rc1`, `-beta2`, …) are marked as GitHub pre-releases.
# - Pull requests that touch the packaging, and manual runs
#   (workflow_dispatch), build the bundle as a workflow artifact without
#   publishing anything.
name: Release

on:
  push:
    tags: ["v*"]
  # Build (but never publish) when the packaging changes, so a broken
  # manifest is caught in review rather than on release day.
  pull_request:
    paths:
      - .github/workflows/release.yml
      - packaging/flatpak/**
      - pyproject.toml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  APP_ID: io.github.skjiisa.ModSync
  MANIFEST: packaging/flatpak/io.github.skjiisa.ModSync.yaml

jobs:
  # The tag must match the version in pyproject.toml, so `modsync --version`
  # inside the bundle says what the release page says. PEP 440 spells 0.1.0rc1
  # what the tag spells v0.1.0-rc1; packaging.version normalises both.
  check-version:
    name: check version
    if: startsWith(github.ref, 'refs/tags/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - name: Compare tag with pyproject.toml and modsync/__init__.py
        run: |
          uv run --no-project --with packaging python - "${GITHUB_REF_NAME#v}" <<'PY'
          import re, sys, tomllib
          from packaging.version import Version

          tag = Version(sys.argv[1])
          with open("pyproject.toml", "rb") as f:
              project = Version(tomllib.load(f)["project"]["version"])
          init = open("modsync/__init__.py").read()
          module = Version(re.search(r'__version__ = "([^"]+)"', init).group(1))
          if not (tag == project == module):
              sys.exit(f"tag {tag} != pyproject {project} / __init__ {module}")
          print(f"version {tag} OK")
          PY

  flatpak:
    name: flatpak bundle
    runs-on: ubuntu-latest
    # The image ships flatpak + flatpak-builder with a KDE runtime pre-cached;
    # the action installs whatever the manifest actually needs
    # (org.kde.Platform//6.11, io.qt.PySide.BaseApp//6.11) from Flathub with
    # --install-deps-from, so the image's 6.10 only saves download time when
    # it matches. Bump the tag when a kde-6.11 image appears.
    container:
      image: ghcr.io/flathub-infra/flatpak-github-actions:kde-6.10
      options: --privileged
    outputs:
      bundle: ${{ steps.name.outputs.bundle }}
    steps:
      - uses: actions/checkout@v4

      - name: Pick the bundle file name
        id: name
        run: |
          version=$(python3 -c 'import tomllib; print(tomllib.load(open("pyproject.toml","rb"))["project"]["version"])')
          echo "bundle=ModSync-${version}-x86_64.flatpak" >> "$GITHUB_OUTPUT"

      # Pinned to a commit: the action is not tagged per release.
      - uses: flathub-infra/flatpak-github-actions/flatpak-builder@933e9e8ca36e85046ebca8e211f0785c6becac40
        with:
          manifest-path: ${{ env.MANIFEST }}
          bundle: ${{ steps.name.outputs.bundle }}
          # The bundle records Flathub as the place to fetch the runtime from
          # when someone installs it.
          repository-url: https://flathub.org/repo/flathub.flatpakrepo
          repository-name: flathub
          cache-key: flatpak-builder-${{ hashFiles(env.MANIFEST, 'packaging/flatpak/python3-*.yaml') }}
          upload-artifact: false

      - name: Smoke-test the bundle
        run: |
          flatpak install --user -y --noninteractive "${{ steps.name.outputs.bundle }}"
          flatpak run --command=modsync "$APP_ID" --version
          flatpak run --command=modsync "$APP_ID" doctor || true
          ls -l "${{ steps.name.outputs.bundle }}"

      - uses: actions/upload-artifact@v4
        with:
          name: flatpak-bundle
          path: ${{ steps.name.outputs.bundle }}
          if-no-files-found: error

  wheel:
    name: wheel + sdist
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: python-dist
          path: dist/*
          if-no-files-found: error

  publish:
    name: publish release
    if: startsWith(github.ref, 'refs/tags/')
    needs: [check-version, flatpak, wheel]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Write release notes
        run: |
          {
            echo "## Install on Steam Deck / Linux"
            echo
            echo "Download **${{ needs.flatpak.outputs.bundle }}**, then in Desktop Mode either"
            echo "open it with Discover, or run:"
            echo
            echo '```sh'
            echo "flatpak install --user ${{ needs.flatpak.outputs.bundle }}"
            echo "flatpak run $APP_ID"
            echo '```'
            echo
            echo "Full instructions, including the from-source route, are in the [README](https://github.com/${GITHUB_REPOSITORY}#install)."
            echo
            echo "## Changes"
            echo
            # The CHANGELOG section for this version, when there is one.
            python3 scripts/changelog_section.py "${GITHUB_REF_NAME#v}" || echo "See CHANGELOG.md."
          } > notes.md
          cat notes.md
      - name: Create the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          prerelease=()
          case "$GITHUB_REF_NAME" in *-*) prerelease=(--prerelease) ;; esac
          gh release create "$GITHUB_REF_NAME" \
            --title "ModSync ${GITHUB_REF_NAME#v}" \
            --notes-file notes.md \
            --verify-tag "${prerelease[@]}" \
            artifacts/flatpak-bundle/*.flatpak artifacts/python-dist/*
