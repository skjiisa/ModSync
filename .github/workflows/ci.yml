name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    name: tests
    runs-on: ubuntu-latest
    env:
      # tests/test_ui_smoke.py builds the dashboard offscreen; no display needed.
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt runtime libraries for the offscreen platform plugin
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            libegl1 libgl1 libxkbcommon0 libfontconfig1 libglib2.0-0 libdbus-1-3

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true

      - name: Install project and dev dependencies
        run: uv sync --extra dev

      - name: Run unit tests
        run: uv run pytest -q

  packaging:
    name: packaging
    runs-on: ubuntu-latest
    env:
      FLATPAK_DIR: packaging/flatpak
      APP_ID: io.github.skjiisa.ModSync
    steps:
      - uses: actions/checkout@v4

      - name: Install desktop-file-utils and appstream
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends desktop-file-utils appstream

      - name: Validate desktop file
        run: desktop-file-validate "$FLATPAK_DIR/$APP_ID.desktop"

      - name: Validate AppStream metainfo (pedantic)
        run: appstreamcli validate --pedantic "$FLATPAK_DIR/$APP_ID.metainfo.xml"

      # flatpak-builder-lint is only distributed as a Flatpak or as the
      # ghcr.io/flathub/flatpak-builder-lint container (there is no GitHub
      # Action); the container is the documented CI route.
      - name: Pull flatpak-builder-lint
        run: docker pull ghcr.io/flathub/flatpak-builder-lint:latest

      - name: Lint AppStream metainfo (flatpak-builder-lint)
        run: |
          docker run --rm -v "$PWD:/mnt" ghcr.io/flathub/flatpak-builder-lint:latest \
            --gha-format appstream "/mnt/$FLATPAK_DIR/$APP_ID.metainfo.xml"

      # Known failures, tracked separately: finish-args-home-filesystem-access,
      # finish-args-unnecessary-xdg-data-Steam-rw-access and
      # finish-args-flatpak-spawn-access. The manifest needs these today (MO2
      # instances live anywhere under $HOME; the launch hook writes into
      # ~/.local/share/Steam; systemd/pgrep go through flatpak-spawn --host).
      # ModSync is not published on Flathub, so no exception is needed; this
      # step reports the errors without failing the build.
      - name: Lint Flatpak manifest (flatpak-builder-lint)
        continue-on-error: true
        run: |
          docker run --rm -v "$PWD:/mnt" ghcr.io/flathub/flatpak-builder-lint:latest \
            --gha-format manifest "/mnt/$FLATPAK_DIR/$APP_ID.yaml"
