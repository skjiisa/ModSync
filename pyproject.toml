[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "modsync"
version = "0.1.0rc1"
description = "Set up Skyrim SE for modding on Steam Deck and Linux: install Mod Organizer 2, keep the game version your mods need, optionally sync between machines"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "GPL-3.0-or-later" }
authors = [{ name = "ModSync contributors" }]
keywords = ["mod-organizer", "steam-deck", "skyrim", "skse", "downgrade", "syncthing", "modding"]

# NOTE: the discovery layer (`modsync doctor`) deliberately uses only the Python
# standard library, so it runs without any of these installed. They are needed
# for the GUI and the sync engine integration.
dependencies = [
    "PySide6>=6.7",
    "httpx>=0.27",
    "platformdirs>=4",
    "qrcode>=7.4",
    "spake2>=0.8",  # PIN-authenticated LAN pairing (pulls in cryptography)
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
modsync = "modsync.__main__:main"

[tool.hatch.build.targets.wheel]
packages = ["modsync"]

# The sdist is explicit so a local Flatpak build tree or scratch files next to
# the checkout never end up in a release.
[tool.hatch.build.targets.sdist]
only-include = [
    "modsync",
    "tests",
    "scripts",
    "packaging",
    "README.md",
    "CHANGELOG.md",
    "CONTRIBUTING.md",
    "LICENSE",
]
