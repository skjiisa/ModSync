# Flatpak manifest for ModSync.
#
# Local build (any Linux with flatpak + flatpak-builder):
#   flatpak install -y flathub org.kde.Platform//6.11 org.kde.Sdk//6.11 io.qt.PySide.BaseApp//6.11
#   flatpak-builder --user --install --force-clean \
#       /tmp/modsync-flatpak-build packaging/flatpak/io.github.skjiisa.ModSync.yaml
#   flatpak run io.github.skjiisa.ModSync
#
# Keep the build dir OUTSIDE the source tree (/tmp above) so the `dir` source
# below doesn't recurse into it.
#
# The build is fully offline (Flathub requirement): every Python wheel is
# pinned by URL + sha256 in python3-modules.yaml / python3-hatchling.yaml
# (generated with flatpak-pip-generator, see README.md), and PySide6 comes from
# Flathub's io.qt.PySide.BaseApp, which is built against the runtime's own Qt.
id: io.github.skjiisa.ModSync
runtime: org.kde.Platform
runtime-version: '6.11'
sdk: org.kde.Sdk
# PySide6 for the KDE 6.11 runtime. flatpak-pip-generator refuses PySide6
# wheels on purpose: the PyPI wheels bundle a second copy of Qt, whereas the
# BaseApp links PySide6 against the Qt already in org.kde.Platform.
base: io.qt.PySide.BaseApp
base-version: '6.11'
command: modsync

build-options:
  env:
    # Tell the BaseApp's cleanup script to drop what ModSync never imports
    # (ModSync only uses QtCore/QtGui/QtWidgets).
    BASEAPP_REMOVE_WEBENGINE: '1'
    BASEAPP_DISABLE_NUMPY: '1'

finish-args:
  # Qt shared-memory transport between the app and the compositor.
  - --share=ipc
  # Native Wayland on the Deck / Plasma; X11 only if there's no Wayland.
  - --socket=wayland
  - --socket=fallback-x11
  # GPU access for Qt's rendering.
  - --device=dri
  # Syncthing needs the network for device discovery, relays and transfers.
  - --share=network
  # Background service management uses flatpak-spawn --host to reach systemd
  # (`modsync service install` writes a systemd --user unit on the host).
  - --talk-name=org.freedesktop.Flatpak
  # Steam's default library (~/.local/share/Steam): read game files + Proton
  # prefixes, and write to compatibilitytools.d for the launch hook
  # (`modsync launch enable`) and to config/ for the "Add to Steam" shortcut.
  - --filesystem=xdg-data/Steam:rw
  # Legacy Steam location; only needs to be read to find the real library.
  - --filesystem=~/.steam:ro
  # Extra Steam libraries on removable media (Steam Deck SD card).
  - --filesystem=/run/media:rw
  # MO2 portable instances can live anywhere the user keeps them.
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

# `cleanup:` only covers files our own modules installed; what the BaseApp
# pre-populated has to be removed by hand.
cleanup-commands:
  - /app/cleanup-BaseApp.sh
  # The shiboken/LLVM toolchain for compiling bindings, which ModSync never does.
  - rm -rf /app/bin/shiboken6* /app/lib/libLLVM* /app/lib/libclang* /app/lib/python*/site-packages/shiboken6_generator* /app/mkspecs /app/include
  # PySide6 modules ModSync doesn't import (Qt3D, QtMultimedia, QtQuick, ...).
  - cd /app/lib/python*/site-packages/PySide6 && for m in Qt*.abi3.so; do case "$m" in QtCore.*|QtGui.*|QtWidgets.*) ;; *) rm -f "$m" "${m%.abi3.so}.pyi" ;; esac; done
  # Qt developer tools (designer, qml*, lupdate, ...), binding-generator inputs
  # and the private ffmpeg copy that only QtMultimedia used.
  - cd /app/lib/python*/site-packages/PySide6 && rm -rf Qt assistant balsam balsamui designer lrelease lupdate qmlformat qmllint qmlls qsb include glue typesystems

modules:
  # --- Bundled Syncthing (pinned static binary) --------------------------------
  - name: syncthing
    buildsystem: simple
    build-commands:
      - install -Dm755 syncthing /app/bin/syncthing
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/syncthing/syncthing/releases/download/v2.1.1/syncthing-linux-amd64-v2.1.1.tar.gz
        sha256: 0b960a67a0391156c2ca45943ed1ceaad9ae1fc3772d967e6aafc5a7c662565d
        strip-components: 1

  # --- Game downgrade tools ----------------------------------------------------
  # xdelta3 applies the community downgrade patches; 7zz unpacks them. Both are
  # small C programs; the recipe itself is fetched at runtime (see
  # modsync/downgrade/). Not yet exercised in a Flatpak build.
  - name: xdelta3
    buildsystem: autotools
    sources:
      - type: archive
        url: https://github.com/jmacd/xdelta-gpl/releases/download/v3.1.0/xdelta3-3.1.0.tar.gz
        sha256: 114543336ab6cee3764e3c03202701ef79d7e5e8e4863fe64811e4d9e61884dc

  - name: 7zip
    buildsystem: simple
    build-commands:
      - make -C CPP/7zip/Bundles/Alone2 -f makefile.gcc
      - install -Dm755 CPP/7zip/Bundles/Alone2/_o/7zz /app/bin/7zz
    sources:
      - type: archive
        url: https://7-zip.org/a/7z2501-src.tar.xz
        sha256: ed087f83ee789c1ea5f39c464c55a5c9d4008deb0efe900814f2df262b82c36e
        strip-components: 0

  # --- Python dependencies (pinned wheels, installed offline) ------------------
  # httpx, qrcode, platformdirs, spake2 (+ cryptography/cffi as manylinux
  # wheels, so no Rust toolchain is needed). PySide6 comes from the BaseApp.
  # qrcode renders via QImage — no Pillow. Regenerate with flatpak-pip-generator
  # (see README.md) when bumping versions.
  - python3-modules.yaml

  # hatchling is ModSync's PEP 517 build backend. Build-only: the module cleans
  # itself up so nothing from it ships in the final app.
  - python3-hatchling.yaml

  # --- ModSync itself ----------------------------------------------------------
  - name: modsync
    buildsystem: simple
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-build-isolation --no-index --no-warn-script-location .
      - install -Dm644 packaging/flatpak/io.github.skjiisa.ModSync.desktop ${FLATPAK_DEST}/share/applications/io.github.skjiisa.ModSync.desktop
      - install -Dm644 packaging/flatpak/io.github.skjiisa.ModSync.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.skjiisa.ModSync.metainfo.xml
      - install -Dm644 packaging/flatpak/icons/io.github.skjiisa.ModSync.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.skjiisa.ModSync.svg
      - install -Dm644 packaging/flatpak/icons/io.github.skjiisa.ModSync.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.skjiisa.ModSync.png
    sources:
      - type: dir
        path: ../..
