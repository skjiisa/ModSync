# Flatpak manifest for ModSync.
#
# Local build (any Linux with flatpak + flatpak-builder):
#   flatpak install -y flathub org.kde.Sdk//6.9 org.kde.Platform//6.9
#   flatpak-builder --user --install --force-clean \
#       /tmp/modsync-flatpak-build packaging/flatpak/io.github.skjiisa.ModSync.yaml
#   flatpak run io.github.skjiisa.ModSync
#
# Keep the build dir OUTSIDE the source tree (/tmp above) so the `dir` source
# below doesn't recurse into it.
#
# The python-deps module pulls wheels from PyPI at build time (build-args:
# --share=network). For a reproducible / Flathub build, replace it with pinned
# wheel sources generated by flatpak-pip-generator — see README.md.
id: io.github.skjiisa.ModSync
runtime: org.kde.Platform
runtime-version: '6.9'
sdk: org.kde.Sdk
command: modsync

finish-args:
  - --share=ipc
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  # Syncthing needs the network for device discovery, relays and transfers:
  - --share=network
  # Discover Steam libraries + Proton prefixes (internal install + SD card):
  - --filesystem=xdg-data/Steam:rw
  - --filesystem=~/.steam:ro
  - --filesystem=/run/media:rw
  # MO2 portable instances can live anywhere the user keeps them:
  - --filesystem=home

cleanup:
  - /include
  - /lib/pkgconfig
  - /share/man
  - '*.a'
  - '*.la'

modules:
  # --- Bundled Syncthing (pinned static binary) --------------------------------
  - name: syncthing
    buildsystem: simple
    build-commands:
      - install -Dm755 syncthing /app/bin/syncthing
    sources:
      - type: archive
        only-arches: [x86_64]
        url: https://github.com/syncthing/syncthing/releases/download/v2.1.1/syncthing-linux-amd64-v2.1.1.tar.gz
        sha256: 0b960a67a0391156c2ca45943ed1ceaad9ae1fc3772d967e6aafc5a7c662565d
        strip-components: 1

  # --- Python dependencies -----------------------------------------------------
  # ModSync only uses QtCore/QtGui/QtWidgets, so PySide6-Essentials is enough
  # (skips the much larger PySide6-Addons). qrcode renders via QImage — no Pillow.
  - name: python-deps
    buildsystem: simple
    build-options:
      build-args:
        - --share=network
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-warn-script-location "PySide6-Essentials>=6.7" "httpx>=0.27" "qrcode>=7.4" "platformdirs>=4"

  # --- ModSync itself ----------------------------------------------------------
  - name: modsync
    buildsystem: simple
    build-options:
      build-args:
        - --share=network  # fetch the hatchling build backend (pin wheels for Flathub)
    build-commands:
      - pip3 install --prefix=${FLATPAK_DEST} --no-deps --no-warn-script-location .
      - install -Dm644 packaging/flatpak/io.github.skjiisa.ModSync.desktop ${FLATPAK_DEST}/share/applications/io.github.skjiisa.ModSync.desktop
      - install -Dm644 packaging/flatpak/io.github.skjiisa.ModSync.metainfo.xml ${FLATPAK_DEST}/share/metainfo/io.github.skjiisa.ModSync.metainfo.xml
      - install -Dm644 packaging/flatpak/icons/io.github.skjiisa.ModSync.svg ${FLATPAK_DEST}/share/icons/hicolor/scalable/apps/io.github.skjiisa.ModSync.svg
      - install -Dm644 packaging/flatpak/icons/io.github.skjiisa.ModSync.png ${FLATPAK_DEST}/share/icons/hicolor/512x512/apps/io.github.skjiisa.ModSync.png
    sources:
      - type: dir
        path: ../..
